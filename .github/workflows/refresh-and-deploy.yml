name: Refresh apartment research and deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apartment-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check apartment sources and create live snapshot
        run: python scripts/refresh_listings.py
      - name: Prepare static website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/live.json _site/data/live.json
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
