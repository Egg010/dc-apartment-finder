name: Refresh apartment research and deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: apartment-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site with historical data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unit parsers and embedded listing data
        run: python -m unittest discover -s tests -v
      - name: Validate client-side scripts
        run: |
          node --check enhancements.js
          node --check leasing.js
          node --check jamie-commute.js
      - name: Research apartment sources and update price history
        run: python scripts/refresh_listings.py
      - name: Save dated public observations for later comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/history.json data/alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily apartment availability observations [skip ci]"
            ARCHIVED=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                ARCHIVED=true
                break
              fi
              echo "Main changed while checking apartments; rebasing dated data (attempt $attempt)."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                break
              fi
            done
            if [ "$ARCHIVED" != true ]; then
              echo "::warning::Could not archive history in Git on this run; deploying the generated JSON anyway."
            fi
          fi
      - name: Publish new unit/price leads as GitHub Issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_alerts.py
      - name: Build static website
        run: |
          mkdir -p _site/data
          cp index.html enhancements.js enhancements.css leasing.js jamie-commute.js _site/
          cp data/live.json data/history.json data/alerts.json _site/data/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
